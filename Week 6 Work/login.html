<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ludo</title>
  <style>
    /* ... (CSS remains unchanged) ... */
    :root { --primary: #2563eb; --bg: #f8fafc; --text: #0f172a; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; margin: 0; align-items: center; justify-content: center; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 90%; max-width: 320px; }
    h2 { text-align: center; margin-top: 0; color: var(--primary); }
    .form-group { margin-bottom: 1rem; text-align: left; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: bold; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    button { background: var(--primary); color: white; border: none; padding: 0.75rem; border-radius: 4px; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 1rem; }
    button:hover { opacity: 0.9; }
    p { text-align: center; font-size: 0.875rem; margin-top: 1.5rem; }
    a { color: var(--primary); text-decoration: none; font-weight: bold; }
  </style>
</head>

<body>
  <main class="card">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const identifier = document.getElementById('identifier').value.trim();
      const pwd = document.getElementById('password').value;
      
      // Fetch users from mock database
      let users = JSON.parse(localStorage.getItem('ludo_users')) || [];
      
      // Find a matching user
      const validUser = users.find(u => 
        (u.username === identifier || u.email === identifier) && u.password === pwd
      );

      if (validUser) {
        // Set the active session
        const sessionData = {
          type: 'registered',
          username: validUser.username,
          email: validUser.email
        };
        localStorage.setItem('ludo_current_user', JSON.stringify(sessionData));
        
        // Remove the alert and uncomment the redirect to welcome.html
        window.location.href = 'welcome.html';
      } else {
        alert('Invalid credentials. Please try again.');
      }
    });
  </script>
</body>

</html>
