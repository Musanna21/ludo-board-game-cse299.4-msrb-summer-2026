<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Ludo</title>
  <style>
    /* ... (CSS remains unchanged) ... */
    :root { --primary: #2563eb; --bg: #f8fafc; --text: #0f172a; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; margin: 0; align-items: center; justify-content: center; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 90%; max-width: 320px; }
    h2 { text-align: center; margin-top: 0; color: var(--primary); }
    .form-group { margin-bottom: 1rem; text-align: left; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: bold; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    button { background: var(--primary); color: white; border: none; padding: 0.75rem; border-radius: 4px; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 1rem; }
    button:hover { opacity: 0.9; }
    p { text-align: center; font-size: 0.875rem; margin-top: 1.5rem; }
    a { color: var(--primary); text-decoration: none; font-weight: bold; }
    .error { color: #ef4444; font-size: 0.75rem; display: none; margin-top: 0.25rem; }
  </style>
</head>

<body>
  <main class="card">
    <h2>Create Account</h2>
    <form id="signupForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required>
        <span class="error" id="passwordError">Passwords do not match</span>
      </div>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </main>

  <script>
    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const pwd = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const errorSpan = document.getElementById('passwordError');

      // 1. Validate Password Match
      if (pwd !== confirm) {
        errorSpan.style.display = 'block';
        return;
      }
      errorSpan.style.display = 'none';

      // 2. Fetch existing users from local storage (or start empty)
      let users = JSON.parse(localStorage.getItem('ludo_users')) || [];

      // 3. Check for duplicates
      const userExists = users.some(u => u.username === username || u.email === email);
      if (userExists) {
        alert('Username or Email already exists. Please try another or login.');
        return;
      }

      // 4. Save new user
      users.push({ email, username, password: pwd });
      localStorage.setItem('ludo_users', JSON.stringify(users));

      alert('Account created! Redirecting to login...');
      window.location.href = 'login.html';
    });
  </script>
</body>

</html>
